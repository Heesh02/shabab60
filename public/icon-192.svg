<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="36" fill="#1b263b" />
  <rect x="8" y="8" width="176" height="176" rx="28" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6" />
  <!-- Coptic Cross Central Element -->
  <g transform="translate(96, 96)" stroke="#d4af37" stroke-width="6" stroke-linecap="round">
    <!-- Vertical and Horizontal Bars -->
    <line x1="0" y1="-50" x2="0" y2="50" />
    <line x1="-50" y1="0" x2="50" y2="0" />
    <!-- 4 decorative corner circles -->
    <circle cx="-25" cy="-25" r="5" fill="#d4af37" />
    <circle cx="25" cy="-25" r="5" fill="#d4af37" />
    <circle cx="-25" cy="25" r="5" fill="#d4af37" />
    <circle cx="25" cy="25" r="5" fill="#d4af37" />
    <!-- Cross endpoints trefoils -->
    <circle cx="0" cy="-50" r="4" fill="#d4af37" />
    <circle cx="0" cy="50" r="4" fill="#d4af37" />
    <circle cx="-50" cy="0" r="4" fill="#d4af37" />
    <circle cx="50" cy="0" r="4" fill="#d4af37" />
  </g>
  <!-- Center gem -->
  <circle cx="96" cy="96" r="10" fill="#9b1b30" stroke="#d4af37" stroke-width="2" />
</svg>
